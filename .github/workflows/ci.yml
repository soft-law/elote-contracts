name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: 4.1.2
  ANCHOR_VERSION: 1.2.1
  # sha256 of anchor-1.2.1-x86_64-unknown-linux-gnu from the otter-sec/anchor release (Anchor moved there
  # in 2026; solana-foundation/anchor redirects).
  ANCHOR_SHA256: 5c899379cbd9a843fa4a730a37ba7ab61357571ffc535036a9afa08e5cd0b99b

jobs:
  client:
    name: Client / typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts && npm --prefix clients/js ci --ignore-scripts
      - name: Generated client and package manifest match the committed IDL
        run: npm run check:client
      - run: npm run typecheck
      - name: Client schedule mirror matches the program's test vectors
        run: npm run test:client
      - name: Client bundle builds
        run: npm run build:client

  program:
    name: Program / build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/solana/install
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          echo "${ANCHOR_SHA256}  $HOME/.local/bin/anchor" | sha256sum -c -
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: rustc --version && solana --version && anchor --version
      # --ignore-keys: the build keypair is random on a fresh checkout and is never the program's key.
      # --arch v0: Anchor 1.2 defaults to SBPF v3, which the Solana 3.x runtime in LiteSVM 0.11
      # cannot load; v0 is what is deployed on devnet. v3 comes with the move to the 4.x crate line.
      - name: Build
        run: NO_DNA=1 anchor build --ignore-keys --arch v0
      - name: Committed IDL matches the build
        run: npm run idl:sync && git diff --exit-code --stat idl/
      - name: Unit and LiteSVM tests
        run: cargo test -p elote_pool
