name: Release client

on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @softlaw/elote-pool-client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci && npm --prefix clients/js ci
      - name: Generated client matches the committed IDL
        run: npm run check:client
      - name: Tag matches the package version
        working-directory: clients/js
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PKG_VERSION" || { echo "tag $TAG_VERSION != package.json $PKG_VERSION"; exit 1; }
      - name: Already published?
        id: published
        working-directory: clients/js
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        if: steps.published.outputs.exists == 'false'
        working-directory: clients/js
        run: npm run build
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        working-directory: clients/js
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
