name: Release client

on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @softlaw/elote-pool-client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships an older npm.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci && npm --prefix clients/js ci
      - name: Generated client matches the committed IDL
        run: node codama.mjs && git diff --exit-code --stat clients/js/src/generated
      - name: Tag matches the package version
        working-directory: clients/js
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PKG_VERSION" || { echo "tag $TAG_VERSION != package.json $PKG_VERSION"; exit 1; }
      - name: Already published?
        id: published
        working-directory: clients/js
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      # No token: the package's trusted publisher on npmjs.com names this repository and this
      # workflow file, and npm attaches provenance automatically. `prepack` builds dist/.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        working-directory: clients/js
        run: npm publish --access public
