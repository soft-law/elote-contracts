name: Release client

on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish @softlaw/elote-pool-client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Protect this environment with required reviewers in the repo settings: a tag push then
    # waits for approval before the job (and its OIDC token) runs.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24 # ships npm 11+, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm --version
      # No install scripts: nothing in the dependency tree runs before the publish.
      - run: npm ci --ignore-scripts && npm --prefix clients/js ci --ignore-scripts
      - name: Generated client and package manifest match the committed IDL
        run: npm run check:client
      - name: Tag matches the package version
        working-directory: clients/js
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PKG_VERSION" || { echo "tag $TAG_VERSION != package.json $PKG_VERSION"; exit 1; }
      - name: Already published?
        id: published
        working-directory: clients/js
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      # No token: the package's trusted publisher on npmjs.com names this repository and this
      # workflow file, and npm attaches provenance automatically. `prepack` builds dist/.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        working-directory: clients/js
        run: npm publish --access public
