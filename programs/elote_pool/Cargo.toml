[package]
name = "elote_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "elote_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }
solana-security-txt = "1.1.3"
# `solana-v3` is the crate cohort anchor-spl 1.2.1 requires by name once default features are off.
# `token_2022` and `token_2022_extensions` are enabled only because anchor-spl references them
# unconditionally (`idl-build` names `token_interface`; the `mint::` init constraint codegen names
# the extension initialisers). The program itself uses classic SPL Token only.
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "token", "associated_token", "token_2022", "token_2022_extensions"] }

# LiteSVM integration tests (programs/elote_pool/tests/).
#
# anchor-lang 1.2.1 (default `solana-v3` feature) is on the Solana 3.x crate line with
# `solana-system-interface ^2`. litesvm 0.11.0 is the newest release on that same line: 0.12
# moves to `solana-system-interface ^3.2`, and 0.17+ are built on the Agave 4.x crates (0.18 also
# needs Rust 1.97), which would put a second, incompatible copy of the `solana-*` crates in the
# test process. The bare `"3"` reqs below let cargo unify on the single 3.x copy that litesvm and
# anchor-lang already share. `cargo tree -d` does list `solana-*` pairs, and each must be one of two
# benign kinds: a forward-compat shim (a 3.x crate that re-exports its 4.x successor, e.g.
# solana-instruction 3.5 -> 4.0, solana-pubkey 3 -> 4) or a crate only anchor-lang's own
# `solana-feature-gate-interface` uses (solana-rent 4.x, solana-system-interface 3.x). Any pair the
# tests see as two distinct types shows up as a compile error in tests/common/mod.rs. Moving to the
# 4.x line, and with it SBPF v3 (see the README), goes with anchor-lang's `solana-v4` feature once
# Anchor's own CI covers `idl-build` under it.
[dev-dependencies]
litesvm = "=0.11.0"
proptest = "1"
serde_json = "1"
solana-account = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "3"
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }
solana-transaction-error = "3"
