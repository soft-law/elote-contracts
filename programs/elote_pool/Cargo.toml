[package]
name = "elote_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "elote_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["event-cpi"] }
solana-security-txt = "1.1.3"
# `token_2022` and `token_2022_extensions` are enabled only because anchor-spl 1.1.2 references them
# unconditionally (`idl-build` names `token_interface`; the `mint::` init constraint codegen names
# the extension initialisers). The program itself uses classic SPL Token only.
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "associated_token", "token_2022", "token_2022_extensions"] }

# LiteSVM integration tests (programs/elote_pool/tests/).
#
# litesvm 0.9.0 is the only release that lines up with anchor-lang 1.1.2: 0.8.2 pins
# `solana-sdk-ids ~3.0` while anchor-lang needs `^3.1.0`, and 0.9.1 moved to `solana-hash ^4.0` +
# `solana-system-interface ^3.0`, which would put a second, incompatible copy of those crates in
# the test process. 0.9.0's `~3.1` Agave line is also the runtime the workspace targets
# (solana-cli 3.1.x). The bare `"3"` reqs below let cargo unify on the single 3.x copy that
# litesvm and anchor-lang already share — `cargo tree -d` must stay free of `solana-*`.
[dev-dependencies]
litesvm = "=0.9.0"
solana-account = "5"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "3"
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }
solana-transaction-error = "3"
